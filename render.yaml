services:
  - type: web
    name: finsight-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false  # Set this in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # Optional, set in Render dashboard
      - key: FRONTEND_URL
        sync: false  # Set to your Vercel frontend URL

