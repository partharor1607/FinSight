<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Rupee symbol -->
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="white" text-anchor="middle">₹</text>
  
  <!-- Chart line accent -->
  <path d="M 20 60 L 30 50 L 40 55 L 50 45 L 60 50 L 70 40" 
        stroke="white" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.8"/>
  
  <!-- Small dots on chart -->
  <circle cx="20" cy="60" r="2" fill="white" opacity="0.9"/>
  <circle cx="30" cy="50" r="2" fill="white" opacity="0.9"/>
  <circle cx="40" cy="55" r="2" fill="white" opacity="0.9"/>
  <circle cx="50" cy="45" r="2" fill="white" opacity="0.9"/>
  <circle cx="60" cy="50" r="2" fill="white" opacity="0.9"/>
  <circle cx="70" cy="40" r="2" fill="white" opacity="0.9"/>
</svg>

